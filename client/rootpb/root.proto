syntax = "proto3";

package rootpb;
option go_package = "github.com/chainreactors/IoM-go/proto/client/rootpb";


message Operator{
  string name = 1;
  string op = 2;
  repeated string args = 4;
  map<string, string> params = 5;
}

message Response{
  int32 status = 1;
  string response = 2;
  string error = 3;
}

// Administrative creation intent. Owner identifiers are opaque to IOM.
message CreateListenerIdentityRequest {
  string operation_id = 1;
  string listener_name = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
}

message ListenerIdentityOperationRequest {
  string operation_id = 1;
}

message ListenerIdentityRequest {
  // Immutable Operator UUID; never a routing name.
  string identity_id = 1;
}

enum ListenerIdentityOperationState {
  LISTENER_IDENTITY_OPERATION_UNSPECIFIED = 0;
  LISTENER_IDENTITY_OPERATION_PENDING = 1;
  LISTENER_IDENTITY_OPERATION_SUCCEEDED = 2;
  LISTENER_IDENTITY_OPERATION_REJECTED = 3;
}

// Non-secret, durable creation result. Success does not imply a running Listener.
message ListenerIdentityOperation {
  string operation_id = 1;
  string listener_name = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
  string actor_id = 5;
  string identity_id = 6;
  ListenerIdentityOperationState state = 7;
  string rejection_code = 8;
  int64 created_at_unix_milli = 9;
  int64 completed_at_unix_milli = 10;
}

message ListenerIdentity {
  string identity_id = 1;
  string listener_name = 2;
  string certificate_fingerprint = 3;
  bool revoked = 4;
  string create_operation_id = 5;
  string owner_id = 6;
  uint64 owner_generation = 7;
}

// Explicit credential read; never included in operation or identity queries.
message ListenerIdentityConfig {
  ListenerIdentity identity = 1;
  string yaml_config = 2;
}

// Conditional administrative cleanup of an original managed creation result.
message RemoveListenerIdentityRequest {
  string operation_id = 1;
  string identity_id = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
}

// Removal IDs have their own namespace, queried via GetListenerIdentityRemoval.
// Success concerns only the original identity; it does not certify deployment
// shutdown, Pipeline cleanup, or port release.
message ListenerIdentityRemoval {
  string operation_id = 1;
  string identity_id = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
  string actor_id = 5;
  string listener_name = 6;
  ListenerIdentityOperationState state = 7;
  string rejection_code = 8;
  // Successful outcomes: "removed" or "already_absent".
  string outcome = 9;
  int64 created_at_unix_milli = 10;
  int64 completed_at_unix_milli = 11;
}

// Trusted management intent, committed before deployment or registration.
// Source identifiers describe the selected management environment; they are
// not authenticated process-start evidence and do not authorize Task callers.
message PrepareListenerRuntimeRequest {
  string operation_id = 1;
  string identity_id = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
  string deployment_id = 5;
  string executor_id = 6;
  string host_id = 7;
  // Expected immutable process instance, distinct from any connection epoch.
  string process_instance_id = 8;
  // "reverse" or "forward". Neither transport is admitted by preparation.
  string transport = 9;
}

message ListenerRuntimeOperationRequest {
  string operation_id = 1;
}

message ListenerRuntimeRequest {
  string runtime_id = 1;
}

enum ListenerRuntimeOperationState {
  LISTENER_RUNTIME_OPERATION_UNSPECIFIED = 0;
  LISTENER_RUNTIME_OPERATION_PENDING = 1;
  LISTENER_RUNTIME_OPERATION_SUCCEEDED = 2;
  LISTENER_RUNTIME_OPERATION_REJECTED = 3;
}

// Immutable result of preparation, also returned after admission is closed.
// Success reserves an original runtime UUID; it does not establish readiness.
message ListenerRuntimePreparation {
  string operation_id = 1;
  string identity_id = 2;
  string owner_id = 3;
  uint64 owner_generation = 4;
  string actor_id = 5;
  string deployment_id = 6;
  string executor_id = 7;
  string host_id = 8;
  string process_instance_id = 9;
  string transport = 10;
  string identity_operation_id = 11;
  string listener_name = 12;
  string runtime_id = 13;
  ListenerRuntimeOperationState state = 14;
  string rejection_code = 15;
  int64 created_at_unix_milli = 16;
  int64 completed_at_unix_milli = 17;
}

enum ListenerRuntimeAdmissionState {
  LISTENER_RUNTIME_ADMISSION_UNSPECIFIED = 0;
  LISTENER_RUNTIME_ADMISSION_AWAITING_REGISTRATION = 1;
  LISTENER_RUNTIME_ADMISSION_CLOSED = 2;
}

// No online/ready/exited claim can be derived from this reservation record.
message ListenerRuntime {
  string runtime_id = 1;
  ListenerRuntimePreparation preparation = 2;
  ListenerRuntimeAdmissionState admission_state = 3;
  int64 created_at_unix_milli = 4;
  string close_operation_id = 5;
  int64 closed_at_unix_milli = 6;
}

message CloseListenerRuntimeAdmissionRequest {
  string operation_id = 1;
  string runtime_id = 2;
  string identity_id = 3;
  string owner_id = 4;
  uint64 owner_generation = 5;
}

// Closure has its own operation namespace. Closing admission never proves
// process exit, Pipeline cleanup, identity revocation, or port release.
message ListenerRuntimeClosure {
  string operation_id = 1;
  string runtime_id = 2;
  string identity_id = 3;
  string owner_id = 4;
  uint64 owner_generation = 5;
  string actor_id = 6;
  ListenerRuntimeOperationState state = 7;
  string rejection_code = 8;
  // Successful outcomes: "admission_closed" or "already_closed".
  string outcome = 9;
  int64 created_at_unix_milli = 10;
  int64 completed_at_unix_milli = 11;
}

// Trusted management binds a deployment-generated public key to one prepared
// runtime. The CSR contains no management authorization; the server verifies
// the original runtime/identity/owner receipt before signing it.
message IssueListenerRuntimeCredentialRequest {
  string operation_id = 1;
  string runtime_id = 2;
  string identity_id = 3;
  string owner_id = 4;
  uint64 owner_generation = 5;
  string csr_pem = 6;
}

// Public runtime credential result. The private key remains with the trusted
// deployment executor that created the CSR.
message ListenerRuntimeCredentialOperation {
  string operation_id = 1;
  string runtime_id = 2;
  string identity_id = 3;
  string owner_id = 4;
  uint64 owner_generation = 5;
  string actor_id = 6;
  string credential_id = 7;
  string certificate_fingerprint = 8;
  string certificate_pem = 9;
  ListenerRuntimeOperationState state = 10;
  string rejection_code = 11;
  int64 created_at_unix_milli = 12;
  int64 completed_at_unix_milli = 13;
  string public_key_fingerprint = 14;
  string ca_certificate_pem = 15;
  string prepare_operation_id = 16;
  string process_instance_id = 17;
  string transport = 18;
}
